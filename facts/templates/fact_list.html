<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script type="text/javascript">
        const token = localStorage.getItem('access_token');
        if(!token){
            console.log("no token");
            message.textContent = "You are not logged in";
            setTimeout(() => {window.location.href = "/login/";}, 1000);
        }
        function showModal(message){
            const modalEl = document.getElementById('factModal')
            const modal = new bootstrap.Modal(modalEl);
            document.getElementById('message').innerHTML = message;
            modal.show();
        }
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catfacts!</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fact-card {
            max-width: 600px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Modal -->
<div class="modal fade" id="factModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-body" id="message">
      </div>
      <div class="modal-footer">
          <button type="button" id="add-more" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

    <div class="container d-flex justify-content-center px-3 ">
        <div class="card fact-card border-0 text-center p-5 bg-white">
            <h1 class="display-5 mb-4 fw-bold text-primary">🐾Fact List</h1>
            {% if nofacts %}
            <p id="fact-text" class="fs-4 lead text-secondary mb-0">
                    Uh-oh, looks like SOMEONE deleted all the facts...
                </p>
            {% endif %}
            <table class="table table-hover">
            	{% for fact in facts %}
					<tr onclick="showModal('{{ fact }}')" id="{{ fact.id }}">
                        <td>{{ fact }}</td>
                        <td>Submitted by: {{fact.author}}</td>
				{% endfor %}

			</table>
            <div class="mt-5">
                <a href="/">
                    <button class="btn btn-primary btn-lg rounded-pill px-5  shadow-sm">
                        Home
                    </button>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

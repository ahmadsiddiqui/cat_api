<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script type="text/javascript">

            if (str.length > 100) {return str.slice(0, maxLength) + '...';}
            return str;
}
        if(!token){
            console.log("no token");
            message.textContent = "You are not logged in";
            setTimeout(() => {window.location.href = "/login/";}, 1000);
        }
        function showModal(id){
            const modalEl = document.getElementById('fact-modal')
            const modal = new bootstrap.Modal(modalEl);
            message = document.getElementById('fact-text-'+id).innerHTML;
            document.getElementById('message').innerHTML = message;
            modal.show();

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catfacts!</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fact-card {
            max-width: 600px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        /* Override Bootstrap's default slide/fade transition */
.modal.fade .modal-dialog {
  transform: scale(0);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Apply the bounce-grow animation when the modal opens */
.modal.show .modal-dialog {
  transform: scale(1);
  animation: growBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* Keyframes combining growth and a subtle elastic bounce */
@keyframes growBounce {
  0% {
    transform: scale(0.3);
    opacity: 0;
  }
  50% {
    transform: scale(1.08); /* Overshoot to create the grow/bounce feeling */
    opacity: 0.8;
  }
  75% {
    transform: scale(0.97); /* Slight recoil */
    opacity: 0.9;
  }
  100% {
    transform: scale(1); /* Settle at normal size */
    opacity: 1;
  }
}
        
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- Modal -->
<div class="modal fade" id="fact-modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-body" id="message">
      </div>
      <div class="modal-footer modla footer-centered">
          <button type="button" id="close" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

    <div class="container d-flex justify-content-center px-3 ">
        <div class="card fact-card border-0 text-center p-5 bg-white">
            <h1 class="display-5 mb-4 fw-bold text-primary">🐾Fact List</h1>
            {% if nofacts %}
            <p id="fact-text" class="fs-4 lead text-secondary mb-0">
                    Uh-oh, looks like SOMEONE deleted all the facts...
                </p>
            {% endif %}
            <table class="table table-hover">
            	{% for fact in facts %}
                <p hidden id="fact-text-{{fact.id}}">{{fact.fact}}</p>
					<tr onclick="showModal({{ fact.id }})" id="{{ fact.id }}">

                        <td id="fact-text-td"><p>{{ fact|truncatechars:30 }}</p></td>
                        <td>Submitted by: {{fact.author}}</td>
				{% endfor %}

			</table>
            <div class="mt-5">
                <a href="/">
                    <button class="btn btn-primary btn-lg rounded-pill px-5  shadow-sm">
                        Home
                    </button>
                </a>
            </div>
        </div>
    </div>
</body>
</html>

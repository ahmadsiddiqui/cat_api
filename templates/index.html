<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cat Facts</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fact-card {
            max-width: 600px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center px-3">
        <div class="card fact-card border-0 text-center p-5 bg-white">
            <h1 class="display-5 mb-4 fw-bold text-primary">🐾 Cat Facts</h1>
            
            <div style="min-height: 100px; display: flex; align-items: center; justify-content: center;">
                <p id="fact-text" class="fs-4 lead text-secondary mb-0">
                    Click the button to fetch a purr-fect fact!
                </p>
            </div>
            
            <div class="mt-5">
                <button id="fetch-btn" class="btn btn-primary btn-lg rounded-pill px-5 shadow-sm">
                    Get Another Fact
                </button>
            </div>
        </div>
    </div>

    <!-- Vanilla JavaScript for API fetching -->
    <script>
        const fetchBtn = document.getElementById('fetch-btn');
        const factText = document.getElementById('fact-text');

        async function getCatFact() {
            // Show loading state
            factText.innerHTML = '<span class="spinner-border spinner-border-sm text-primary" role="status"></span> Loading...';
            fetchBtn.disabled = true;

            try {
                // 1. Try fetching from the local Django API
                let response = await fetch('/api/facts/random/');
                let data = await response.json();
                
                if (response.ok && data.fact) {
                    factText.textContent = data.fact;
                } else {
                    throw new Error('Local database might be empty');
                }
            } catch (error) {
                // 2. Fallback to external API if local fails or is empty
                console.log("Local API failed, using fallback...", error);
                try {
                    let fallbackResponse = await fetch('https://catfact.ninja/fact');
                    let fallbackData = await fallbackResponse.json();
                    factText.textContent = fallbackData.fact;
                    factText.append("Source: CatNinja");
                } catch (fallbackError) {
                    factText.textContent = "Oops! Couldn't fetch a cat fact right meow. Try again!";
                }
            } finally {
                // Re-enable the button
                fetchBtn.disabled = false;
            }
        }

        // Attach click event to the button
        fetchBtn.addEventListener('click', getCatFact);

        // Fetch a fact automatically when the page loads
        window.addEventListener('DOMContentLoaded', getCatFact);
    </script>
    
    <!-- Bootstrap JS (Optional, for tooltips/modals etc) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

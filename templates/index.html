{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Catfacts!</title>
	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background-color: #e9ecef;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.fact-card, .name-card {
			max-width: 600px;
			width: 100%;
			border-radius: 1rem;
			box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
		}
		.sprite-character {
  		/* Dimensions must exactly match a single frame */
 		 width: 84px;
  		height: 100px;
  
  		/* Path to your horizontal sprite sheet */
  		background-image: url("{% static 'sprite.png' %}");
  		background-repeat: no-repeat;
  
  		/* Apply the keyframe animation */
  		/* Duration, number of frames in steps(), and loop behavior */
  		animation: play-sprite 0.5s steps(6) infinite ;
		}

		@keyframes play-sprite {
		  0% {
		    background-position: 0px 0px;
		  }
		  100% {
		    /* Move left by the exact total width of the sprite sheet */
		    background-position: -525px 0px;
		  }
		}
	</style>
</head>
<body>
	<div class="container d-flex flex-column justify-content-center px-3 mt-4">
		
		<div class="container d-flex justify-content-center px-3">
			<div class="card name-card border-0 text-center p-3 bg-white">            
				<div style="min-height: 20px; display: flex; align-items: center; justify-content: center;">
					<p class="fs-4 lead text-secondary mb-0"> Hello <span id="user-greeting" ></span></p>
				</div>
			</div>
		</div>
		<div class="container d-flex justify-content-center px-3">
			<a href="/login"><button id="login-btn" class="btn btn-primary d-flex btn-lg rounded-pill my-3 px-5 shadow-sm">Login</button></a>
			<button id="logout-btn" class="btn btn-primary d-flex btn-lg rounded-pill my-3 px-5 shadow-sm">Logout</button></a>
		</div>
		<div class="container d-flex justify-content-center px-3">

			<div id="main-card"class="card fact-card border-0 text-center p-5 bg-white">
				<div class="display-1 mx-auto text-center sprite-character"></div>
				<h1 class="display-5 mb-4 justify-content-center fw-bold text-primary">Cat Facts</h1>
				
				<div style="min-height: 100px; display: flex; align-items: center; justify-content: center;">

					<p id="fact-text" class="fs-4 lead text-secondary mb-0">
						Click the button to fetch another fact!
					</p>
					
				</div>

				
				<div class="mt-5">
					<button id="fetch-btn" class="btn btn-primary btn-lg rounded-pill my-3 px-5 shadow-sm">
						Get Another Fact!
					</button>
					</br>
					<a class="btn btn-light btn-md  my-3 mx-2 px-5 shadow-sm" href="/submit" role="button">Submit a cat fact</a>
					<a class="btn btn-light btn-md  my-3 mx-2 px-5 shadow-sm" href="/fact_list" role="button">See all facts</a>
					<a class="btn btn-light btn-md  my-3 mx-2 px-5 shadow-sm" href="/dashboard" role="button">My facts</a>
				</div>
			</div>
		</div>
	</div>


	<!-- Vanilla JavaScript for API fetching -->
	<script>
		const fetchBtn = document.getElementById('fetch-btn');
		const factText = document.getElementById('fact-text');
		const loginBtn = document.getElementById('login-btn');
		const logoutBtn = document.getElementById('logout-btn');
		const mainCard = document.getElementById('main-card');
		const userGreeting = document.getElementById('user-greeting');
		let data;
		function hide(element){
			element.classList.add("d-none");
		}
		function show(element){
			element.classList.remove("d-none")
		}
		const token = localStorage.getItem('access_token');
		if(!token){
			factText.textContent = "Not logged in";
			console.log("No token found");
			hide(logoutBtn); show(loginBtn);
			hide(mainCard)

		} 
		else{
			hide(loginBtn); show(logoutBtn);
			show(mainCard);

			const userProfile = loadUserProfile();
			console.log(userProfile);
			console.log(userProfile.username);

			loadUserProfile().then(userProfile => {
				userGreeting.textContent=userProfile.username;
				console.log(userProfile.username);
			});
			

			fetchBtn.addEventListener('click',() =>{
				getCatFact().then(fact => {
					factText.textContent = fact;
				}).catch((error)=> {
				factText.textContent = "click the button";
				})
			});

			window.addEventListener('DOMContentLoaded', () =>{
				getCatFact().then(fact => {
					factText.textContent = fact;
				})
			});
		}

		
		async function loadUserProfile() {
			try {
				//const token = localStorage.getItem('access_token');
				if(!token) return;
				const response = await fetch('/api/profile/', {
					method: 'GET',
					headers: {
						'Authorization': `Bearer ${token}` 
					}
				});
				if(response.ok){
					const data = await response.json();
					return data;
				}
			}
			catch(error){
				console.log("loadUserProfile() try/catch failed")
				return error;
			}
		}

		async function getCatFact() {
			try {
				const response = await fetch('/api/random/', {
				method: 'GET',
				headers: {
					'Authorization': `Bearer ${token}` 
				}

			});
				const data = await response.json();
				if (response.ok && data.fact) {
					factText.textContent = data.fact;
					return data.fact;
				} else {
					throw new Error('Local database might be empty');
				}
			} catch (error) {
				console.log("Facts could not be fetched", error);
				return error;
			}
		}
		
		document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.reload();
        });
	</script>
	
	<!-- Bootstrap JS (Optional, for tooltips/modals etc) -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<script type="text/javascript">
        const token = localStorage.getItem('access_token');
        console.log(token);
        if(!token){
            console.log("no token");
            setTimeout(() => {window.location.href = "/login/";}, 1000);
        }
        async function loadUserProfile() {
            if(!token){
                console.log("no token");
                setTimeout(() => {window.location.href = "/login/";}, 1000);
            }

            try {
                const token = localStorage.getItem('access_token');
                    if(!token){
                        console.log("No access token");
                        return;
                    } 
    
                    const response = await fetch('/api/profile/', {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}` 
                        }
                    });
                    if(response.ok){
                        const data = await response.json();
                        console.log(data);
                        return data;
    
                    }
                }
                catch(error){
                    console.log("loadUserProfile() try/catch failed")
                    return 0;
                }
            }
        async function fetchUserId() {
            const userProfile = await loadUserProfile();
            return userProfile.id
        }
        async function fetchUserName() {
            const userProfile = await loadUserProfile();
            return userProfile.username
        }


        async function fetchFacts(){
            const token = localStorage.getItem('access_token');
            const factTable = document.getElementById('fact-table');
            const msgContainer= document.getElementById("message");
            msgContainer.innerHTML = "Loading..."
            factTable.innerHTML = "";
            try{
                const response = await fetch('/filtered-facts/',{
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok){
                    if(response.status === 401){
                        throw new Error("Unauthorized, session may have expired")
                    }
                   throw new Error(`HTTP error! status: ${response.status}`); 
                }

                const facts = await response.json();
                msgContainer.innerHTML = "Facts by " + await fetchUserName();

                if(facts.length === 0){
                    msgContainer.innerHTML = "No facts to show";
                    return
                }
                facts.forEach(fact =>{
                    const factId = fact.id;
                    const factElementTr = document.createElement('tr');
                    factElementTr.id = factId;
                    const factTextTd = document.createElement('td');
                    const factDeleteTd = document.createElement('td');
                    
                    factTextTd.innerHTML= fact.fact;

                    factDeleteTd.innerHTML = "&#10060"

                    factDeleteTd.style.cursor= "pointer";
                    console.log(factId);
                    factDeleteTd.addEventListener('click', (event) => {
                        deleteFact(factId);
                    });
                    factElementTr.append(factTextTd);
                    factElementTr.append(factDeleteTd)
                    factTable.append(factElementTr);


                });
            } catch (error) {
                console.error("Fetch error:", error);
                message.innerHTML = `<p style='color: red;'>${error.message}</p>`;
            }
        }

        async function deleteFact(factId){
            // console.log(factId);
            const tr = document.getElementById(factId);

            if(!token){
                console.log("no token");
                setTimeout(() => {window.location.href = "/login/";}, 1000);
            }
            try{
                const response = await fetch(`/api/facts/${factId}/`, {
                    method : 'DELETE',
                    headers: {
                        'Authorization':`Bearer ${token}`,
                        'Content-Type':'application/json'
                    }
                });
                if(response.ok){
                    console.log("factDeleted");
                    tr.remove();
                    await fetchFacts();
                }

            }
            catch(error) {console.error('Failed:', error);}
        }
	
    </script>

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catfacts!</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fact-card {
            max-width: 600px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .deleteBtn{
        	cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body onload="fetchFacts()">


    <div class="container d-flex justify-content-center px-3">
        <div class="card fact-card border-0 text-center p-5 bg-white">
            <h1 class="display-5 mb-4 fw-bold text-primary">🐾Fact List</h1>
           
            <p id="message" class="fs-4 lead text-secondary mb-0">
                    No facts submitted by 
                </p>
            
            <table class="table table-hover">
                <tbody id="fact-table"></tbody>
			</table>

            <a href="/"><button class="btn btn-primary btn-lg rounded-pill px-5  shadow-sm">Home</button></a>
        </div>
    </div>


</body>
</html>

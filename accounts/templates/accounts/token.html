<!-- templates/dashboard/api_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Developer Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; margin: 40px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        button { background: #0066cc; color: white; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0052a3; }
        .token-box { display: none; background: #f8f9fa; border: 1px solid #e1e4e8; padding: 15px; border-radius: 4px; margin-top: 20px; word-break: break-all; font-family: monospace; font-size: 13px; position: relative; }
        .warning { color: #d9381e; font-size: 13px; margin-top: 8px; display: none; font-weight: bold; }
        .copy-btn { background: #28a745; margin-top: 10px; padding: 6px 12px; font-size: 12px; }
        .copy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>Developer API Access</h2>
    <p>Use your persistent token to authenticate automated external scripts and API requests. Treat this token exactly like a password.</p>
    
    <!-- Action Button -->
    <button id="generateBtn">Generate New API Token</button>

    <!-- Token Container (Hidden by default) -->
    <div id="tokenContainer" class="token-box">
        <strong>Your API Token:</strong>
        <div id="tokenValue" style="margin-top: 10px; color: #0052a3;"></div>
        <button id="copyBtn" class="copy-btn">Copy Token</button>
    </div>
    <p id="warningText" class="warning">⚠️ Make sure to copy this token now! For security reasons, you won't be able to see it again.</p>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', async function() {
        if (!confirm('Generating a new token will not delete old ones unless you have blacklisting enabled. Proceed?')) return;

        const token = localStorage.getItem('access_token');

        try {
            // Make POST request to Django backend
            const response = await fetch("{% url 'generate_api_key' %}", {
                method: "POST",
                headers: {
                    
                    "Content-Type": "application/json",
                    'Authorization': `Bearer ${token}` 

                }
            });

            if (response.ok) {
                const data = await response.json();
                
                // Display the token string to the user
                document.getElementById('tokenValue').innerText = data.api_token;
                document.getElementById('tokenContainer').style.display = 'block';
                document.getElementById('warningText').style.display = 'block';
            } else {
                alert('Failed to generate token. Please ensure you are logged in.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An unexpected error occurred.');
        }
    });

    // Copy to Clipboard Functionality
    document.getElementById('copyBtn').addEventListener('click', function() {
        const tokenText = document.getElementById('tokenValue').innerText;
        navigator.clipboard.writeText(tokenText).then(() => {
            const originalText = this.innerText;
            this.innerText = 'Copied!';
            this.style.background = '#1e7e34';
            setTimeout(() => {
                this.innerText = originalText;
                this.style.background = '#28a745';
            }, 2000);
        });
    });
</script>

</body>
</html>

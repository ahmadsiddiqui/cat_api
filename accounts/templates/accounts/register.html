<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #e9ecef;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 600px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="container d-flex justify-content-center px-3">
        <div class="card login-card border-0 text-center p-5 bg-white">
            <h1 class="display-5 mb-4 fw-bold text-primary">🐾 Create Account</h1>
            <form id="registerForm">
                <div class="my-1">
                    <input class="form-control" type="text" id="username" placeholder="Username" required></input>
                </div>
                <div class="my-1">
                    <input class="form-control" type="email" id="email" placeholder="Email" required></input>
                </div>
                <div class="my-1">
                    <input class="form-control" type="password" id="password" placeholder="Password" required></input>
                </div>
                <div class="mt-2">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5  shadow-sm">
                        Register
                    </button>
                </div>
        </form>
        
    </div>
    <!-- Modal -->
<div class="modal fade" id="messageModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
        <div class="modal-body text-center" id="message">
            Loading...
        </div>
        <div id="spinner" class="d-flex justify-content-center mb-2">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
             </div>
        </div>
    </div>
  </div>
</div>

<script>
    const modalElement = document.getElementById('messageModal');
    const myModal = new bootstrap.Modal(modalElement);
    const spinnerElement = document.getElementById('spinner');
    hide(spinnerElement);
    // show(spinnerElement);
    // myModal.show();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {

        e.preventDefault();
        const msgEl = document.getElementById('message');
        show(spinnerElement);
        msgEl.textContent = "Loading..."; 
        myModal.show();
        const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };
        const response = await fetch('/api/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        
        const data = await response.json();
        if (response.ok) {
                hide(spinnerElement);
                msgEl.textContent = "Registration successful! You can now log in.";
                msgEl.style.color = "green";
                myModal.show();
                setTimeout(() => { window.location.href = "/login/";}, 1000);
            } else {
                hide(spinnerElement);
                msgEl.textContent = "Error registering.";
                msgEl.style.color = "red";
                myModal.show();
                setTimeout(() => { window.location.reload;}, 1000);
            }
        });

    function hide(element){
        element.classList.add("d-none");
    }
    function show(element){
        element.classList.remove("d-none")
    }
</script>

</body>
</html>

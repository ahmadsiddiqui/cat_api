<!DOCTYPE html>
<html>
<head><title>Protected Dashboard</title></head>
<body>
    <h2>Dashboard</h2>
    <button id="fetchDataBtn">Fetch Protected Data</button>
    <button id="logoutBtn" style="color: red;">Logout</button>
    
    <pre id="api-response">Awaiting API response...</pre>

    <script>
        // Redirect to login if token doesn't exist
        const token = localStorage.getItem('access_token');
        if (!token) {
            window.location.href = '/login/';
        }

        document.getElementById('fetchDataBtn').addEventListener('click', async () => {
            const outputEl = document.getElementById('api-response');

            const response = await fetch('/api/facts/', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${localStorage.getItem('access_token')}` 
                }
            });
            
            const data = await response.json();
            
            if (response.status === 401) {
                outputEl.textContent = "Token expired. Please log in again.";
                localStorage.removeItem('access_token');
            } else {
                outputEl.textContent = JSON.stringify(data, null, 2);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/login/';
        });
    </script>
</body>
</html>
